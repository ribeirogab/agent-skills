<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="generator" content="how-it-works">
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<script>document.documentElement.lang="{{lang}}";try{var theme=localStorage.getItem("how-it-works:theme");if(theme)document.documentElement.dataset.theme=theme}catch(error){}</script>
<style>
{{css}}
</style>
</head>
<body>
<header class="topbar">
<span class="meta"><span class="slug">{{slug}}</span><span class="dot">·</span><span>{{updated}} {{date}}</span></span>
<span class="actions">
<button class="bar-button" id="all-screens" type="button" aria-label="{{screens}}"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M2.5 10.5l3-3 3 3 2-2 3 3"/></svg><span class="text">{{screens}}</span><span class="count" id="screen-count"></span></button>
<button class="bar-button" id="theme-toggle" type="button" data-label-light="{{light}}" data-label-dark="{{dark}}" aria-label="{{dark}}"></button>
</span>
</header>
<nav class="toc" aria-label="{{contents}}">
{{toc}}
</nav>
<main class="guide" id="guide" data-build="{{build}}">
{{content}}
</main>
<dialog class="viewer" id="viewer" aria-label="{{screens}}">
<div class="viewer-toolbar">
<span class="viewer-title" id="viewer-title"></span>
<span class="viewer-count" id="viewer-count" aria-live="polite"></span>
<button class="icon-button" type="button" data-step="-1" aria-label="{{previous}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
<button class="icon-button" type="button" data-step="1" aria-label="{{next}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
<span class="viewer-separator"></span>
<a class="icon-button" id="viewer-open" target="_blank" rel="noopener" aria-label="{{open}}" title="{{open}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 10.5l5-5M6.5 5.5h4v4"/></svg></a>
<button class="icon-button" type="button" data-close aria-label="{{close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
</div>
<div class="viewer-stage"><img class="viewer-image" id="viewer-image" alt=""></div>
<p class="viewer-caption" id="viewer-caption"></p>
</dialog>
<script type="module">
{{js}}
</script>
</body>
</html>
