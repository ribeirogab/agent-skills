<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="show-design">
<meta name="description" content="Technical design: {{title}}. The design is the content of the main element; the review-comments JSON after it holds the review thread and the explanation requests; the style and script at the end only render the page. Sections with class lesson teach the reader; they are not decisions or requirements, so /to-spec and implementation skip them.">
<title>{{title}}</title>
<style>body{visibility:hidden}</style>
<script>try{var theme=localStorage.getItem("show-design:theme");if(theme)document.documentElement.dataset.theme=theme}catch(error){}</script>
</head>
<body data-slug="{{slug}}" data-build="{{build}}">
<main class="design" id="design" data-anchor="page">
{{content}}
</main>
<script type="application/json" id="review-comments">
{{comments}}
</script>
<header class="topbar sd-ui">
<span class="meta"><span class="slug">{{slug}}</span><span class="dot">·</span>built {{built}}</span>
<span class="actions">
<span class="mode-group" role="group" aria-label="Review mode">
<button class="bar-button" id="comment-mode" type="button" aria-pressed="false" data-tip="Comment mode (C)">Comment</button>
<button class="bar-button" id="explain-mode" type="button" aria-pressed="false" data-tip="Explain mode (E)">Explain</button>
</span>
<span class="bar-divider" aria-hidden="true"></span>
<button class="bar-button" id="comments-list" type="button" aria-expanded="false" aria-controls="drawer" aria-label="All comments" data-tip="All comments"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2zM5 6h6M5 8.2h4"/></svg><span data-count="open">0</span></button>
<button class="bar-button" id="lessons-list" type="button" aria-expanded="false" aria-controls="reader" aria-label="Lessons" data-tip="Lessons"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.6C6.7 3.6 4.9 3.2 2.5 3.4v8.8c2.4-.2 4.2.2 5.5 1.2 1.3-1 3.1-1.4 5.5-1.2V3.4c-2.4-.2-4.2.2-5.5 1.2zM8 4.6v8.8"/></svg><span data-count="lessons">0</span></button>
<span class="bar-divider" aria-hidden="true"></span>
<button class="bar-button" id="theme-toggle" type="button" data-tip="Switch theme" aria-label="Switch theme"></button>
</span>
</header>
<nav class="toc" id="toc" aria-label="Contents"></nav>
<aside class="reader sd-ui" id="reader" aria-label="Lesson"></aside>
<div class="reader-resize sd-ui" id="reader-resize" title="Drag to resize · double-click to reset"></div>
<button class="selection-chip sd-ui" id="selection-chip" type="button" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.6C6.7 3.6 4.9 3.2 2.5 3.4v8.8c2.4-.2 4.2.2 5.5 1.2 1.3-1 3.1-1.4 5.5-1.2V3.4c-2.4-.2-4.2.2-5.5 1.2zM8 4.6v8.8"/></svg>Explain</button>
<div class="drawer-backdrop sd-ui" id="drawer-backdrop"></div>
<aside class="drawer sd-ui" id="drawer" aria-label="Comments" aria-modal="true" role="dialog">
<div class="drawer-head">
<h2>Comments</h2>
<div class="tabs" role="tablist" aria-label="Filter comments">
<button type="button" role="tab" data-filter="open" aria-selected="true">Open <span data-count="open">0</span></button>
<button type="button" role="tab" data-filter="resolved" aria-selected="false">Resolved <span data-count="resolved">0</span></button>
<button type="button" role="tab" data-filter="all" aria-selected="false">All</button>
</div>
<button class="icon-button" id="drawer-close" type="button" aria-label="Close comments" data-tip="Close">×</button>
</div>
<div class="drawer-list" id="drawer-list"></div>
<div class="drawer-foot">
<p class="drawer-mode" id="drawer-mode"></p>
<button class="button" id="copy-comments" type="button">Copy open comments as Markdown</button>
</div>
</aside>
<style>
{{css}}
</style>
<script type="module">
{{js}}
</script>
</body>
</html>
