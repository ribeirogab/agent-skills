<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="show-design">
<meta name="description" content="Technical design: {{title}}. The design is the content of the main element; the review-comments JSON after it holds the review thread; the style and script at the end only render the page.">
<title>{{title}}</title>
<style>body{visibility:hidden}</style>
</head>
<body data-slug="{{slug}}" data-build="{{build}}">
<main class="design" id="design">
{{content}}
</main>
<script type="application/json" id="review-comments">
{{comments}}
</script>
<header class="page-meta">
<span class="eyebrow">Technical design</span>
<code class="slug">{{slug}}</code>
<span class="built">Built {{built}}</span>
<span class="legend" aria-label="Change legend"><span class="tag added">added</span><span class="tag changed">changed</span><span class="tag removed">removed</span><span class="tag moved">moved</span><span class="tag proposed">proposed</span><span class="tag unverified">unverified</span></span>
</header>
<nav class="toc" id="toc" aria-label="Contents"></nav>
<aside class="review" id="review" aria-label="Review comments">
<div class="review-header">
<h2>Review</h2>
<div class="tabs" role="tablist" aria-label="Filter comments">
<button type="button" role="tab" data-filter="open" aria-selected="true">Open <span data-count="open">0</span></button>
<button type="button" role="tab" data-filter="resolved" aria-selected="false">Resolved <span data-count="resolved">0</span></button>
<button type="button" role="tab" data-filter="all" aria-selected="false">All</button>
</div>
<button class="review-close" id="review-close" type="button" aria-label="Close comments">×</button>
</div>
<p class="review-hint">Select text and press Comment, hover a block and press +, or click a diagram node.</p>
<div class="review-list" id="review-list"></div>
<div class="review-footer">
<p class="review-mode" id="review-mode"></p>
<button class="button" id="copy-comments" type="button">Copy open comments as Markdown</button>
</div>
</aside>
<button class="review-toggle" id="review-toggle" type="button" aria-controls="review" aria-expanded="false">Comments <span data-count="open">0</span></button>
<style>
{{css}}
</style>
<script type="module">
{{js}}
</script>
</body>
</html>
